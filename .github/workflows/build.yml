name: build BetterThanIME
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*' # 当推送以 v 开头的 tag 时触发构建和发布

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        os: [ubuntu-latest] # 构建只需在一个系统上运行即可
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: gradle

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  # 新增 publish 任务，用于自动发布 Release
  publish:
    if: startsWith(github.ref, 'refs/tags/') # 仅在推送 tag 时执行
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限才能创建 Release
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          # 上传 build/libs 下的所有 jar 文件，排除 sources 和 dev 包（如果有的话）
          files: |
            build/libs/*.jar
          # 自动生成 Release 说明
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
